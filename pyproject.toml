[project]
name = "fragmented-keys-django"
version = "0.1.9"
description = "Django cache management with fragmented keys for better invalidation support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "fragmented-keys>=0.1.3",
]

[project.optional-dependencies]
django-redis = [
    "django-redis>=5.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fragmented_keys_django*"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a running Redis instance on localhost:6379",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
